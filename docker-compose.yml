name: mini-game-backend

services:
  mysql:
    image: mysql:8.4
    container_name: minigame-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-minigame}
      MYSQL_USER: ${DB_USER:-minigame}
      MYSQL_PASSWORD: ${DB_PASSWORD:-minigame_dev_password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: mini-game-backend/api:${VERSION:-dev}
    container_name: minigame-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-minigame}
      DB_PASSWORD: ${DB_PASSWORD:-minigame_dev_password}
      DB_NAME: ${DB_NAME:-minigame}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./frontend/admin
      additional_contexts:
        certs: ./docker/certs
    image: mini-game-backend/admin:${VERSION:-dev}
    container_name: minigame-admin
    ports:
      - "${ADMIN_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
