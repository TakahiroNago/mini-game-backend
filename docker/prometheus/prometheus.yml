# Prometheus configuration for the compose stack.
# The API is scraped over the internal compose network (service name "api").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: minigame-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
